log_format ark_protocol '$time_iso8601 $remote_addr $request_method $uri $status $body_bytes_sent $request_time';
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/arknights/certs/server.crt;
    ssl_certificate_key /etc/arknights/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 127.0.0.1;
    allow 192.168.240.0/24;
    deny all;
    access_log /var/log/nginx/arknights-access.log ark_protocol;
    error_log /var/log/nginx/arknights-error.log warn;
    client_max_body_size 32m;
    location / {
        proxy_pass http://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
    }
}
